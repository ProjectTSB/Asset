name: lint-datapack
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Minecraft data
        uses: actions/cache@v4
        with:
          path: ~/.cache/mcf-linter-spark
          key: mcf-linter-spark-data-1.20.4-c85548aae6f2-5aab1da2ff00

      - name: Cache mcf-linter-spark
        id: cache-linter
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/mcf-linter-spark
          key: mcf-linter-spark-${{ runner.os }}-35ae24c

      - name: Install mcf-linter-spark
        if: steps.cache-linter.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/EllaCoat/mcf-linter-spark --rev 35ae24c1459433674a5c8720e0767027b76ec253 --locked mcf-linter-spark

      - name: Test
        run: mcf-linter-spark check . --ignore 'animated_java:**' --format github
